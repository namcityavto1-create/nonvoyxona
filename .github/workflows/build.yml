name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare app
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          echo '{"appId":"uz.nonvoyxona.hisob","appName":"Nonvoyxona","webDir":"www"}' > capacitor.config.json
          npx cap add android
          npx cap sync android
      - name: Icons
        run: |
          npm install sharp
          node -e "const s=require('sharp'),fs=require('fs');const d={mdpi:48,hdpi:72,xhdpi:96,xxhdpi:144,xxxhdpi:192};const r='android/app/src/main/res/';fs.rmSync(r+'mipmap-anydpi-v26',{recursive:true,force:true});(async()=>{for(const k in d){const o=r+'mipmap-'+k+'/';await s('icon-512.png').resize(d[k],d[k]).toFile(o+'ic_launcher.png');await s('icon-512.png').resize(d[k],d[k]).toFile(o+'ic_launcher_round.png');fs.rmSync(o+'ic_launcher_foreground.png',{force:true})}})()"
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" android/app/build/outputs/apk/debug/app-debug.apk --title "Nonvoyxona APK ${{ github.run_number }}" --notes "Nonvoyxona APK"
