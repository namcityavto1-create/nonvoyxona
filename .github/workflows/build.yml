name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare app
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          echo '{"appId":"uz.nonvoyxona.hisob","appName":"Nonvoyxona","webDir":"www"}' > capacitor.config.json
          npx cap add android
          npx cap sync android
      - name: Icons
        run: |
          cd android/app/src/main/res
          rm -rf mipmap-anydpi-v26
          for p in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $p
            convert "$GITHUB_WORKSPACE/icon-512.png" -resize ${2}x${2} mipmap-$1/ic_launcher.png
            cp mipmap-$1/ic_launcher.png mipmap-$1/ic_launcher_round.png
            rm -f mipmap-$1/ic_launcher_foreground.png
          done
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" android/app/build/outputs/apk/debug/app-debug.apk --title "Nonvoyxona APK ${{ github.run_number }}" --notes "Nonvoyxona APK"
